[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendta"
version = "0.1.0"
description = "Interpretador de do-files com interface no estilo do Stata 14 (projeto pessoal de estudo)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yaske Palhares" }]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/yaskepalhares/opendta"
Download = "https://github.com/yaskepalhares/opendta/releases/latest"

[project.optional-dependencies]
# leitura de .dta antigos (formatos 114/115 e anteriores) pela ReadStat
legacy = ["pyreadstat>=1.3"]
# planilhas .xls antigas (import excel); .xlsx usa o openpyxl, já incluído
xls = ["xlrd>=2.0"]
# pyreadstat também serve de verificador independente nos testes de .dta;
# o pandas só é usado nos testes, para gravar arquivos pela ReadStat
dev = ["pytest>=8", "pyreadstat>=1.3", "pandas>=2"]

[project.scripts]
opendta = "opendta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opendta = ["gui/icons/*.svg", "gui/appicon/*.png", "help/*.sthlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
