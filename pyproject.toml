[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendta"
version = "0.0.1"
description = "Interpretador de do-files com interface no estilo do Stata 14 (projeto pessoal de estudo)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yaske Palhares" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opendta = "opendta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opendta = ["gui/icons/*.svg", "gui/appicon/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
