[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendta"
version = "0.2.0"
description = "Do-file interpreter with a Stata 14-style interface (personal study project)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yaske Palhares" }]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/yaskepalhares/opendta"
Download = "https://github.com/yaskepalhares/opendta/releases/latest"

[project.optional-dependencies]
# reading old .dta files (formats 114/115 and earlier) through ReadStat
legacy = ["pyreadstat>=1.3"]
# old .xls spreadsheets (import excel); .xlsx uses openpyxl, already included
xls = ["xlrd>=2.0"]
# pyreadstat also serves as an independent checker in the .dta tests;
# pandas is only used in the tests, to write files through ReadStat
dev = ["pytest>=8", "pyreadstat>=1.3", "pandas>=2"]

[project.scripts]
opendta = "opendta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opendta = ["gui/icons/*.svg", "gui/appicon/*.png", "help/*.sthlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
