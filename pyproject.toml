[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendta"
version = "0.8.1"
description = "Do-file interpreter with a Stata 14-style interface (personal study project)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yaske Palhares" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    # CA certificates for the update check in the packaged application
    "certifi>=2023.7",
]

[project.urls]
Homepage = "https://github.com/yaskepalhares/opendta"
Download = "https://github.com/yaskepalhares/opendta/releases/latest"

[project.optional-dependencies]
# reading old .dta files (formats 114/115 and earlier) through ReadStat
legacy = ["pyreadstat>=1.3"]
# old .xls spreadsheets (import excel with xlrd, export excel with xlwt); .xlsx uses openpyxl,
# already included
xls = ["xlrd>=2.0", "xlwt>=1.3"]
# pyreadstat also serves as an independent checker in the .dta tests and reads SAS, SPSS and XPORT files;
# pandas is only used in the tests (and by export sasxport), to write files through ReadStat; xlrd and
# xlwt are in the dev extra so that the .xls tests run. pyreadstat 1.3.7 returns an empty strL of
# 3000 characters for release 119 files (1.2.8 to 1.3.6 read them; our own reader round-trips them),
# hence the cap in dev until it is checked against a later release.
dev = ["pytest>=8", "pyreadstat>=1.3,<1.3.7", "pandas>=2", "xlrd>=2.0", "xlwt>=1.3"]

[project.scripts]
opendta = "opendta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opendta = ["gui/icons/*.svg", "gui/appicon/*.png", "help/*.sthlp", "data/*.dta", "data/icd/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
