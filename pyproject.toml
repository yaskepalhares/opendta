[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendta"
version = "0.0.1"
description = "Interpretador de do-files com interface no estilo do Stata 14 (projeto pessoal de estudo)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yaske Palhares" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
]

[project.optional-dependencies]
# leitura de .dta antigos (formatos 114/115 e anteriores) pela ReadStat
legacy = ["pyreadstat>=1.3"]
# pyreadstat também serve de verificador independente nos testes de .dta;
# o pandas só é usado nos testes, para gravar arquivos pela ReadStat
dev = ["pytest>=8", "pyreadstat>=1.3", "pandas>=2"]

[project.scripts]
opendta = "opendta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opendta = ["gui/icons/*.svg", "gui/appicon/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
