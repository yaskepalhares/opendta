name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: pytest by file (diagnostic)
        shell: bash
        run: |
          cat > /tmp/runone.py <<'PY'
          import subprocess, sys, glob, time
          for f in sorted(glob.glob("tests/test_*.py")):
              s = time.time()
              try:
                  r = subprocess.run([sys.executable, "-m", "pytest", "-q", "-x", "-v", f], capture_output=True, text=True, timeout=240)
                  rc, out = r.returncode, r.stdout
              except subprocess.TimeoutExpired as e:
                  rc, out = 124, (e.stdout or b"").decode(errors="replace") if isinstance(e.stdout, bytes) else (e.stdout or "")
              if rc != 0:
                  lines = [l for l in out.splitlines() if l.strip()]
                  print("::error title=%s::rc=%s %ds last=%s" % (f, rc, time.time() - s, " | ".join(lines[-3:])[:400]), flush=True)
          print("::notice title=finished::all files visited", flush=True)
          PY
          python /tmp/runone.py
      - name: Comparison with Stata
        run: python tools/compare.py --show-diff
