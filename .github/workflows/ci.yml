name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: pytest
        shell: bash
        run: |
          pytest -q --tb=line > pytest_out.txt 2>&1; rc=$?
          grep -E "^(FAILED|ERROR)|Error|assert" pytest_out.txt | head -12 | cut -c1-400 | sed 's/^/::error::/'
          exit $rc
      - name: Comparison with Stata
        run: python tools/compare.py --show-diff
