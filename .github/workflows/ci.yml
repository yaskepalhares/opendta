name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: pytest
        if: runner.os != 'Linux'
        run: pytest -q
      - name: pytest by file (diagnostic)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          for f in tests/test_*.py; do
            timeout 240 pytest -q -x "$f" > /tmp/out.txt 2>&1; rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error title=$f::rc=$rc $(tail -n 4 /tmp/out.txt | tr '\n' ' ' | cut -c1-400)"
            fi
          done
          echo "::notice title=finished::all files visited"
      - name: Comparison with Stata
        run: python tools/compare.py --show-diff
