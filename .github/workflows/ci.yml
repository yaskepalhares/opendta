name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: Comparison with Stata 14
        run: python tools/compare.py --show-diff
      # TEMPORARY diagnostic (to be removed before merging): the full Windows diff as one annotation
      - name: Windows comparison details
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          python tools/compare.py > summary.txt || true
          grep -E '^  XX ' summary.txt > failing.txt || true
          { cat failing.txt; for c in $(awk '{print $2}' failing.txt); do python tools/compare.py --show-diff "$c" || true; done; } > details.txt
          python -c "import sys; t=open('details.txt',encoding='utf-8',errors='replace').read(); print('::error title=windows-diff::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
