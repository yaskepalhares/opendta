name: download release

# Builds the macOS installers (Apple Silicon and Intel) and the Windows
# installer and portable .zip (x64), and publishes a Release on GitHub. Runs
# when a v* tag is pushed (e.g. git tag v1.0.0 && git push origin v1.0.0). In
# pull requests that touch the packaging, and from the Actions tab
# ("Run workflow"), it only builds and tests the files, without publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "tools/build_macos.sh"
      - "tools/build_windows.ps1"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    # a tag must match the version inside the app: otherwise the installed copy keeps offering
    # the same update (tags v0.2.1 and v0.2.2 were built with __version__ = "0.2.0")
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag, __init__.py and pyproject.toml agree
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/opendta/__init__.py)
          proj=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "__init__.py: $code  pyproject.toml: $proj  ref: $GITHUB_REF_NAME"
          test "$code" = "$proj" || { echo "::error::__version__ ($code) differs from pyproject.toml ($proj)"; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*) test "$GITHUB_REF_NAME" = "v$code" || { echo "::error::tag $GITHUB_REF_NAME does not match version $code"; exit 1; } ;;
          esac

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15            # Apple Silicon (M1 onward)
            name: OpenDTA-macos-apple-silicon
          - runner: macos-15-intel      # Intel (supported by GitHub until late 2027)
            name: OpenDTA-macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build OpenDTA.app and the .dmg
        env:
          PYTHON: python
          DMG_NAME: ${{ matrix.name }}
        run: tools/build_macos.sh
      - name: Test the packaged executable (batch mode)
        run: |
          cd "$RUNNER_TEMP"
          printf 'set obs 10\ngen t = _n\ngen x = t^2\nsummarize x\nregress x t\nhistogram x\ngraph export h.png, replace\n' > teste.do
          "$GITHUB_WORKSPACE/dist/OpenDTA.app/Contents/MacOS/OpenDTA" -b do teste.do
          cat teste.log
          grep -q "end of do-file" teste.log
          test -f h.png
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest            # x64 (Intel/AMD)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build the installer and the portable .zip
        shell: pwsh
        run: tools/build_windows.ps1
      - name: Test the portable executable (batch mode)
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          "set obs 10`ngen t = _n`ngen x = t^2`nsummarize x`nregress x t`nhistogram x`ngraph export h.png, replace`n" | Set-Content -NoNewline -Encoding utf8 teste.do
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE\dist\OpenDTA\OpenDTA.exe" -ArgumentList "-b", "do", "teste.do" -Wait -PassThru -NoNewWindow
          function Fail($m) { Write-Output "::error::$m"; exit 1 }
          if (-not (Test-Path teste.log)) { Fail "portable: teste.log not written (exit code $($p.ExitCode))" }
          Get-Content teste.log
          if (-not (Select-String -Path teste.log -Pattern "end of do-file" -Quiet)) { Fail "portable: batch run failed" }
          if (-not (Test-Path h.png)) { Fail "portable: graph export failed" }
      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          function Fail($m) { Write-Output "::error::$m"; exit 1 }
          $dir = "$env:RUNNER_TEMP\OpenDTA-installed"
          $p = Start-Process -FilePath "dist\OpenDTA-windows-x64-setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\OpenDTA.exe")) { Fail "OpenDTA.exe not installed in $dir" }
          Set-Location $env:RUNNER_TEMP
          Remove-Item teste.log -ErrorAction SilentlyContinue
          $r = Start-Process -FilePath "$dir\OpenDTA.exe" -ArgumentList "-b", "do", "teste.do" -Wait -PassThru -NoNewWindow
          if (-not (Test-Path teste.log)) { Fail "installed: teste.log not written (exit code $($r.ExitCode))" }
          if (-not (Select-String -Path teste.log -Pattern "end of do-file" -Quiet)) { Fail "installed: batch run failed" }
          $key = "HKCU:\Software\Classes\.do\OpenWithProgids"
          if (-not (Test-Path $key)) { Fail "registry key $key missing" }
          $names = (Get-Item $key).GetValueNames()
          if (-not ($names -contains "OpenDTA.File")) { Fail "Open with entry missing (values: $($names -join ', '))" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { Fail "uninstaller exit code $($u.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDTA-windows-x64
          path: |
            dist/OpenDTA-windows-x64-setup.exe
            dist/OpenDTA-windows-x64-portable.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.dmg dist/*.exe dist/*.zip \
            --title "OpenDTA ${TAG#v}" \
            --notes-file .github/release-notes.md
