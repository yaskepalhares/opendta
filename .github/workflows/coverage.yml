name: coverage page

# Redraws the command-coverage heatmap on every push to main and publishes it on
# GitHub Pages (https://yaskepalhares.github.io/opendta/): the interactive page and
# the two SVG images shown in ROADMAP.md. Needs Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies (no interface needed)
        run: pip install numpy scipy openpyxl matplotlib certifi
      - name: Draw the heatmap
        run: python tools/roadmap_coverage.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
